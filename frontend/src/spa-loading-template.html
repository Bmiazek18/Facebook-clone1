<!DOCTYPE html>
<html {{ HTML_ATTRS }}>
  <head>
    {{ HEAD }}
    <style>
      /* Stylowanie czystym CSS dla zerowego czasu oczekiwania i braku mignięcia */
      #static-facebook-splash {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding: 2rem 0;
        z-index: 999999;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        user-select: none;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body {{ BODY_ATTRS }}>
    {{ APP_SLOTS }}

    <!-- Statyczny ekran ładowania renderowany przez serwer w 0ms -->
    <div id="static-facebook-splash">
      <!-- Pusta przestrzeń do wyrównania flexboxa -->
      <div></div>

      <!-- Centrowane logo Facebooka -->
      <div style="display: flex; align-items: center; justify-content: center;">
        <svg
          width="80"
          height="80"
          viewBox="0 0 24 24"
          fill="#0866FF"
          aria-hidden="true"
        >
          <path
            d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
          />
        </svg>
      </div>

      <!-- Stopka "from Meta" na dole -->
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
        <span style="font-size: 12px; color: #65676B; letter-spacing: -0.01em;">from</span>
        <svg
          height="16"
          viewBox="0 0 100 20"
          fill="#0866FF"
          aria-hidden="true"
        >
          <path
            d="M19.1 2.3C16.2 2.3 13.8 4.2 12.1 6.8 10.4 4.2 8 2.3 5.1 2.3 2.1 2.3 0 4.7 0 8.3v9.4h3.6V9c0-2 1.2-3.3 2.7-3.3 1.6 0 2.6 1.1 2.6 3v8.7h3.6V9c0-2 1.2-3.3 2.7-3.3 1.6 0 2.6 1.1 2.6 3v8.7h3.6V8.3c0-3.6-2.1-6-5.1-6z"
          />
        </svg>
      </div>
    </div>
    <script>
      (function() {
        if (window.location.pathname.includes('video-call') || window.location.search.includes('conversationId')) {
          var el = document.getElementById('static-facebook-splash');
          if (el) {
            el.style.backgroundColor = '#000000';
            el.style.display = 'none';
          }
        }
      })();
    </script>
  </body>
</html>
