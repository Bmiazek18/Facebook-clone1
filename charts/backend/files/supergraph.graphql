# This file is replaced by CI after `rover supergraph compose`.
# Bootstrap placeholder kept in git so Argo CD can sync the object.
schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/join/v0.5", for: EXECUTION)
{
  query: Query
}

directive @join__graph(name: String!, url: String!) on ENUM_VALUE
directive @link(url: String, as: String, for: link__Purpose, import: [link__Import]) repeatable on SCHEMA

scalar link__Import

enum link__Purpose {
  EXECUTION
}

enum join__Graph {
  USERS @join__graph(name: "users", url: "http://userservice-edge:8081/graphql")
  SOCIALGRAPH @join__graph(name: "socialgraph", url: "http://socialgraph-edge:8082/graphql")
}

type Query {
  _empty: String
}
