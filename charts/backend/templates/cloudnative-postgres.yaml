apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: apps
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  
  postgresql:
    parameters:
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "4MB"
      min_wal_size: "2GB"
      max_wal_size: "8GB"
      max_worker_processes: "4"
      max_parallel_workers_per_gather: "2"
      max_parallel_workers: "4"
      max_parallel_maintenance_workers: "2"
  
  bootstrap:
    initdb:
      database: users_db
      owner: postgres
      secret:
        name: postgres-secret
  
  storage:
    size: 10Gi
    storageClass: local-path
  
  monitoring:
    enabled: true
    customQueries:
      - name: pg_stat_statements
        query: |
          SELECT
            query,
            calls,
            mean_exec_time,
            max_exec_time
          FROM pg_stat_statements
          ORDER BY mean_exec_time DESC
          LIMIT 10
  
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      wal:
        compression: gzip
      data:
        compression: gzip
      destinationPath: s3://backups/postgres
      s3Credentials:
        accessKeyId:
          name: s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: s3-credentials
          key: SECRET_ACCESS_KEY
      serverName: postgres-cluster

  # Health checks
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  
  nodeMaintenanceWindow:
    inMaintenanceWindow: false
    reusePVC: true

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: apps
type: Opaque
stringData:
  password: "change-me-secure-password"

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: apps
spec:
  selector:
    cnpg.io/cluster: postgres-cluster
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-rw
  namespace: apps
spec:
  selector:
    cnpg.io/cluster: postgres-cluster
    role: primary
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
  type: ClusterIP

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-notifications
  namespace: apps
spec:
  instances: 2
  primaryUpdateStrategy: unsupervised
  
  postgresql:
    parameters:
      shared_buffers: "128MB"
      effective_cache_size: "512MB"
      maintenance_work_mem: "32MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "8MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "2MB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"
      max_worker_processes: "2"
      max_parallel_workers_per_gather: "1"
      max_parallel_workers: "2"
  
  bootstrap:
    initdb:
      database: notifications_db
      owner: postgres
      secret:
        name: postgres-notifications-secret
  
  storage:
    size: 5Gi
    storageClass: local-path
  
  monitoring:
    enabled: true
  
  backup:
    retentionPolicy: "7d"
    barmanObjectStore:
      wal:
        compression: gzip
      data:
        compression: gzip
      destinationPath: s3://backups/postgres-notifications
      s3Credentials:
        accessKeyId:
          name: s3-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: s3-credentials
          key: SECRET_ACCESS_KEY
      serverName: postgres-notifications

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  nodeMaintenanceWindow:
    inMaintenanceWindow: false
    reusePVC: true

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-notifications-secret
  namespace: apps
type: Opaque
stringData:
  password: "change-me-secure-password"

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-notifications
  namespace: apps
spec:
  selector:
    cnpg.io/cluster: postgres-notifications
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-notifications-rw
  namespace: apps
spec:
  selector:
    cnpg.io/cluster: postgres-notifications
    role: primary
  ports:
  - port: 5432
    targetPort: 5432
    name: postgresql
  type: ClusterIP
