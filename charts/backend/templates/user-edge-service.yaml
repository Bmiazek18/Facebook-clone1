apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice-edge
  labels:
    app: userservice-edge
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: userservice-edge
  template:
    metadata:
      labels:
        app: userservice-edge
    spec:
      containers:
        - name: user-edge-service
          image: "{{ .Values.images.userEdgeService.repository }}:{{ .Values.images.userEdgeService.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: USER_SERVICE_GRPC_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: USER_SERVICE_GRPC_ADDRESS
            - name: JAVA_TOOL_OPTIONS
              value: -Xms128m -Xmx256m
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: userservice-edge
spec:
  selector:
    app: userservice-edge
  ports:
    - name: http
      port: 8081
      targetPort: http
