apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-abr-service
  namespace: apps
  labels:
    app: video-abr-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: video-abr-service
  template:
    metadata:
      labels:
        app: video-abr-service
    spec:
      containers:
        - name: video-abr-service
          image: "{{ .Values.images.videoAbrService.repository }}:{{ .Values.images.videoAbrService.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8085
            - name: grpc
              containerPort: 9095
          env:
            - name: RABBITMQ_URL
              value: "amqp://guest:guest@rabbitmq.apps.svc.cluster.local:5672/"
            - name: FEED_SERVICE_GRPC_ADDRESS
              value: "feedservice:9092"
            - name: MINIO_ENDPOINT
              value: "minio:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-runtime-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-runtime-secrets
                  key: MINIO_SECRET_KEY
            - name: NOTIFICATION_SERVICE_GRPC_ADDRESS
              value: "notificationservice:9093"
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: backend-runtime-secrets
                  key: SENTRY_DSN
            - name: SENTRY_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: SENTRY_ENVIRONMENT
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: backend-runtime-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: transcode-scratch
              mountPath: /app/uploads
      volumes:
        - name: transcode-scratch
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: video-abr-service
  namespace: apps
spec:
  selector:
    app: video-abr-service
  ports:
    - name: http
      port: 8085
      targetPort: http
    - name: grpc
      port: 9095
      targetPort: grpc
