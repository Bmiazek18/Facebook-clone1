apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: apps
data:
  config.hcl: |
    storage "file" {
      path = "/vault/data"
    }
    
    listener "tcp" {
      address       = "0.0.0.0:8200"
      tls_disable   = 1
    }
    
    ui = true
    disable_mlock = true

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: apps
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      serviceAccountName: vault
      containers:
      - name: vault
        image: vault:latest
        args:
        - "server"
        - "-dev"
        ports:
        - containerPort: 8200
          name: http

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        env:
        - name: VAULT_DEV_ROOT_TOKEN_ID
          value: "vault-root-token"
        - name: VAULT_DEV_LISTEN_ADDRESS
          value: "0.0.0.0:8200"
        - name: VAULT_ADDR
          value: "http://127.0.0.1:8200"
        volumeMounts:
        - name: vault-data
          mountPath: /vault/data
        - name: vault-config
          mountPath: /vault/config
        livenessProbe:
          httpGet:
            path: /v1/sys/health
            port: 8200
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /v1/sys/health
            port: 8200
          initialDelaySeconds: 10
          periodSeconds: 5
      securityContext:
        fsGroup: 1000
  volumeClaimTemplates:
  - metadata:
      name: vault-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: local-path
      resources:
        requests:
          storage: 5Gi
  
  initContainers:
  - name: vault-config
    image: vault:latest
    command: ['cp', '-v', '/vault/config/config.hcl', '/vault/data/config.hcl']
    volumeMounts:
    - name: vault-config
      mountPath: /vault/config
    - name: vault-data
      mountPath: /vault/data
  
  volumes:
  - name: vault-config
    configMap:
      name: vault-config

---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: apps
spec:
  selector:
    app: vault
  ports:
  - port: 8200
    targetPort: 8200
    name: http
  type: ClusterIP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: apps

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "read", "update", "delete", "list"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create", "read", "update", "delete", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault
subjects:
- kind: ServiceAccount
  name: vault
  namespace: apps
