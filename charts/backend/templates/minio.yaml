apiVersion: v1
kind: Secret
metadata:
  name: minio-creds-secret
  namespace: apps
type: Opaque
stringData:
  accesskey: {{ .Values.secrets.MINIO_ACCESS_KEY | quote }}
  secretkey: {{ .Values.secrets.MINIO_SECRET_KEY | quote }}

---
apiVersion: minio.min.io/v2
kind: Tenant
metadata:
  name: minio
  namespace: apps
spec:
  image: minio/minio:RELEASE.2024-01-28T22-35-53Z
  imagePullPolicy: {{ .Values.imagePullPolicy }}
  credsSecret:
    name: minio-creds-secret
  pools:
    - servers: 2              # 2 nodes for High Availability in the home-lab
      volumesPerServer: 2     # 2 drives per node (giving 4 drives total, perfect for Erasure Coding parity)
      volumeClaimTemplate:
        spec:
          accessModes: [ "ReadWriteOnce" ]
          storageClassName: local-path
          resources:
            requests:
              storage: 5Gi    # 5Gi per drive = 20Gi raw storage
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
  requestAutoCert: false       # Set to false to simplify home-lab setups without local TLS/cert-manager
  features:
    bucketDNS: false
