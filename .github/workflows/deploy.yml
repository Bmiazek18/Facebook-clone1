name: Build and Update GitOps

on:
  push:
    branches:
      - main
    # Ignoruj zmiany w folderze chart, aby bot nie zapętlił sam siebie
    paths-ignore:
      - 'chart/values.yaml'
  workflow_dispatch: # Pozwala na ręczne uruchomienie z panelu GitHub

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Image Tag in Helm values
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Automatyczna podmiana tagu obrazu w pliku values.yaml na unikalny SHA commita
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' chart/values.yaml
          
          git add chart/values.yaml
          git commit -m "chore(ci): update image tag to ${{ github.sha }} [skip ci]" || exit 0
          git push