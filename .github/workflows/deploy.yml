name: Build and Update GitOps

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'charts/**/values.yaml'
      - 'chart/values.yaml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ========================================================
  # KROK 1: Wykrywanie zmian w katalogach
  # ========================================================
  changes:
    runs-on: ubuntu-latest
    outputs:
      nuxt: ${{ steps.filter.outputs.nuxt }}
      keycloak: ${{ steps.filter.outputs.keycloak }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            nuxt:
              - 'frontend/**'
            keycloak:
              - 'keycloak/**'

  # ========================================================
  # KROK 2: Budowanie Frontendu (Nuxt)
  # ========================================================
  build-nuxt:
    needs: changes
    if: ${{ needs.changes.outputs.nuxt == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set Image Name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-frontend" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Nuxt Image
        uses: docker/build-push-action@v6.15.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Nuxt Tag in GitOps
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          
          TARGET_FILE="charts/frontend/values.yaml"
          [ -f "$TARGET_FILE" ] || TARGET_FILE="chart/values.yaml"

          sed -i "s|repository: .*|repository: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}|" $TARGET_FILE
          sed -i 's/tag: .*/tag: "${{ github.sha }}"/' $TARGET_FILE
          
          git add $TARGET_FILE
          git commit -m "chore(ci): update nuxt image tag to ${{ github.sha }} [skip ci]" || exit 0
          git push origin main

  # ========================================================
  # KROK 3: Budowanie Keycloak (React Themes + Java SPI)
  # ========================================================
  build-keycloak:
    needs: [changes, build-nuxt]
    if: ${{ always() && (needs.changes.outputs.keycloak == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js for Keycloakify
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'keycloak/themes/package-lock.json'

      - name: Build React Keycloakify Theme JAR
        run: |
          if [ -d "keycloak/themes" ]; then
            cd keycloak/themes
           
            npm ci
            npm run build-keycloak-theme
            
            mkdir -p ../dist_jars
            cp dist_keycloak/*.jar ../dist_jars/ || true
            cd ../..
          fi

      - name: Set up JDK 21 for Custom SPI
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Java Custom SPI JARs
        run: |
          if [ -d "keycloak/spi" ]; then
            cd keycloak/spi
            mvn clean package -DskipTests
            mkdir -p ../dist_jars
            cp target/*.jar ../dist_jars/ || true
            cd ../..
          fi

      - name: Set Image Name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-keycloak" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Custom Keycloak Image
        uses: docker/build-push-action@v6.15.0
        with:
          context: ./keycloak
          file: ./keycloak/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Keycloak Tag in GitOps
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          
          TARGET_FILE="charts/keycloak/values.yaml"
          [ -f "$TARGET_FILE" ] || TARGET_FILE="chart/values.yaml"

          sed -i "s|image: .*|image: \"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\"|" $TARGET_FILE
          
          git add $TARGET_FILE
          git commit -m "chore(ci): update keycloak image tag to ${{ github.sha }} [skip ci]" || exit 0
          git push origin main