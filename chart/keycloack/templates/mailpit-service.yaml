apiVersion: v1
kind: Service
metadata:
  name: mailpit
  namespace: {{ .Release.Namespace | default "apps" }}
  labels:
    app: mailpit
spec:
  type: ClusterIP
  ports:
    - name: smtp
      port: 1025
      targetPort: 1025
    - name: ui
      port: 8025
      targetPort: 8025
  selector:
    app: mailpit