---
# ==============================================================================
# PLAY 1: PROXMOX HOST - GPU PASSTHROUGH & LXC CONFIGURATION
# ==============================================================================
- name: "Proxmox Host: Configure NVIDIA GPU Passthrough for LXC"
  hosts: proxmox_host
  gather_facts: false
  roles:
    - role: proxmox_gpu
      when: enable_gpu_passthrough | bool
      tags: [proxmox, gpu_host]

# ==============================================================================
# PLAY 2: K3S CONTAINER - SYSTEM SETUP, HARDENING, K3S, GPU & GITOPS
# ==============================================================================
- name: "K3s Node: Bootstrap System, Hardening, K3s, GPU Toolkit, and GitOps"
  hosts: k3s_node
  gather_facts: true
  roles:
    - role: system_common
      tags: [system, node_setup]

    - role: security_hardening
      tags: [security, hardening, node_setup]

    - role: k3s_server
      tags: [k3s, node_setup]

    - role: nvidia_container
      when: enable_gpu_passthrough | bool
      tags: [gpu_container]

    - role: argocd_gitops
      tags: [gitops, argocd]
