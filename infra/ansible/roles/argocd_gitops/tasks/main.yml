---
- name: Create Kubernetes namespaces (apps, infra, argocd)
  ansible.builtin.shell:
    cmd: "/usr/local/bin/k3s kubectl create namespace {{ item }} --dry-run=client -o yaml | /usr/local/bin/k3s kubectl apply -f -"
  loop: "{{ k8s_namespaces }}"
  changed_when: false

- name: Install Argo CD via official manifests
  ansible.builtin.command: "/usr/local/bin/k3s kubectl apply --server-side -n argocd -f {{ argocd_manifest_url }}"
  changed_when: false

- name: Wait for Argo CD service to exist
  ansible.builtin.command: "/usr/local/bin/k3s kubectl get svc argocd-server -n argocd"
  register: argocd_svc
  until: argocd_svc.rc == 0
  retries: 30
  delay: 3
  changed_when: false

- name: Patch Argo CD server service to NodePort ({{ argocd_http_nodeport }} / {{ argocd_https_nodeport }})
  ansible.builtin.command: >
    /usr/local/bin/k3s kubectl patch svc argocd-server -n argocd -p
    '{"spec": {"type": "NodePort", "ports": [{"name": "http", "port": 80, "targetPort": 8080, "nodePort": {{ argocd_http_nodeport }}}, {"name": "https", "port": 443, "targetPort": 8083, "nodePort": {{ argocd_https_nodeport }}}]}}'
  changed_when: false

- name: Configure GitHub Webhook Secret in Argo CD for instant sync (<0.5s)
  when: github_webhook_secret != ""
  ansible.builtin.shell:
    cmd: >
      /usr/local/bin/k3s kubectl patch secret argocd-secret -n argocd -p
      '{"stringData": {"webhook.github.secret": "{{ github_webhook_secret }}"}}'
  changed_when: false

- name: Deploy Cloudflare Tunnel (cloudflared)
  when: cloudflare_tunnel_token != ""
  ansible.builtin.shell:
    cmd: |
      cat <<EOF | /usr/local/bin/k3s kubectl apply -f -
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: cloudflared
        namespace: infra
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: cloudflared
        template:
          metadata:
            labels:
              app: cloudflared
          spec:
            containers:
            - name: cloudflared
              image: cloudflare/cloudflared:latest
              args:
              - tunnel
              - --no-autoupdate
              - run
              - --token
              - {{ cloudflare_tunnel_token }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
      EOF
  changed_when: true

- name: Configure GitHub private repository secret in Argo CD
  when: github_repo_password != ""
  ansible.builtin.shell:
    cmd: |
      cat <<EOF | /usr/local/bin/k3s kubectl apply -f -
      apiVersion: v1
      kind: Secret
      metadata:
        name: repo-github-private
        namespace: argocd
        labels:
          argocd.argoproj.io/secret-type: repository
      stringData:
        type: git
        url: {{ github_repo_url }}
        username: {{ github_repo_username }}
        password: {{ github_repo_password }}
      EOF
  changed_when: true

- name: Wait for Argo CD Application CRD
  ansible.builtin.command: "/usr/local/bin/k3s kubectl get crd applications.argoproj.io"
  register: app_crd
  until: app_crd.rc == 0
  retries: 30
  delay: 3
  changed_when: false

- name: Register Root GitOps Application (platform-apps)
  ansible.builtin.shell:
    cmd: |
      cat <<EOF | /usr/local/bin/k3s kubectl apply -f -
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: platform-apps
        namespace: argocd
        finalizers:
          - resources-finalizer.argocd.argoproj.io
      spec:
        project: default
        source:
          repoURL: '{{ github_repo_url }}'
          targetRevision: HEAD
          path: 'infra/argocd'
        destination:
          server: 'https://kubernetes.default.svc'
          namespace: 'argocd'
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
      EOF
  changed_when: true
