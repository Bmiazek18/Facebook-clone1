# router.yaml
supergraph:
  listen: 0.0.0.0:4000
  path: /graphql
  introspection: true

cors:
  allow_any_origin: true

sandbox:
  enabled: true

homepage:
  enabled: false

include_subgraph_errors:
  all: true

health_check:
  listen: 0.0.0.0:8088
  path: /health


headers:
  all:
    request:
      - propagate:
          named: "Authorization"
      - propagate:
          named: "X-User-Id"
      - propagate:
          named: "X-Actor-Id"
      - propagate:
          named: "X-Entity-Type"
      - propagate:
          named: "X-Original-User-Id"
      - propagate:
          named: "traceparent"
      - propagate:
          named: "tracestate"
      - propagate:
          named: "baggage"
      - propagate:
          named: "x-request-id"
      - propagate:
          named: "x-correlation-id"

rhai:
  scripts: "/dist/config"
  main: "main.rhai"

plugins:
  custom.jwt_auth:
    jwks_url: "http://keycloak-service:8080/realms/facebook-clone/protocol/openid-connect/certs"
    issuer: "https://auth.lab-bm.com/realms/facebook-clone"
