spring.application.name=NotificationService

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql-notifications.apps.svc.cluster.local:5432/notifications_db}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8083
grpc.server.port=9093

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
# Observability: OpenTelemetry
otel.sdk.disabled=false
otel.traces.exporter=otlp
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
otel.exporter.otlp.headers=Authorization=Bearer ${OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION:}
otel.service.name=notification-service
otel.traces.sampler=parentbased_traceidratio
otel.traces.sampler.arg=0.1
otel.instrumentation.spring-web.enabled=true
otel.instrumentation.grpc.enabled=true
otel.instrumentation.jpa.enabled=true
otel.instrumentation.jdbc.enabled=true

# Sentry
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}
sentry.enable-tracing=true
sentry.attach-stacktrace=true
sentry.include-exception-cause=true
logging.level.io.sentry=debug

# MQTT Configuration
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.client.id=notification-service-publisher
mqtt.username=${MQTT_USERNAME:notification-service}
mqtt.password=${MQTT_PASSWORD:notification-service-secret}

