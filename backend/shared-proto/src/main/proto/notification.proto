syntax = "proto3";

package com.facebook.notification.grpc;

option java_multiple_files = true;
option java_package = "com.facebook.notification.grpc";
option go_package = "video-abr-service/pb/notification";

service NotificationGrpcService {
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
  rpc MarkAsRead(MarkAsReadRequest) returns (MarkAsReadResponse);
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);
  rpc DeleteNotification(DeleteNotificationRequest) returns (DeleteNotificationResponse);
}

message NotificationDto {
  int64 id = 1;
  string userId = 2;
  string title = 3;
  string message = 4;
  bool read = 5;
  string createdAt = 6;
  string targetId = 7;
}

message GetHistoryRequest {
  string userId = 1;
}

message GetHistoryResponse {
  repeated NotificationDto notifications = 1;
}

message MarkAsReadRequest {
  int64 id = 1;
}

message MarkAsReadResponse {
  bool success = 1;
}

message SendNotificationRequest {
  string userId = 1;
  string title = 2;
  string message = 3;
  string targetId = 4;
}

message SendNotificationResponse {
  NotificationDto notification = 1;
}

message DeleteNotificationRequest {
  string userId = 1;
  string title = 2;
  string targetId = 3;
}

message DeleteNotificationResponse {
  bool success = 1;
}
