syntax = "proto3";

package com.facebook.abr.grpc;

option java_multiple_files = true;
option java_package = "com.facebook.abr.grpc";
option go_package = "video-abr-service/pb";

service AbrGrpcService {
  rpc GetVideoInfo(GetVideoInfoRequest) returns (GetVideoInfoResponse);
  rpc ProcessStoryImage(ProcessStoryImageRequest) returns (ProcessStoryImageResponse);
  rpc EnqueueVideoTranscode(EnqueueVideoTranscodeRequest) returns (EnqueueVideoTranscodeResponse);
}

message GetVideoInfoRequest {
  string fileId = 1;
}

message GetVideoInfoResponse {
  string fileId = 1;
  bool isVideo = 2;
}

message ProcessStoryImageRequest {
  string fileId = 1;
}

message StoryImageVariant {
  int32 width = 1;
  int32 height = 2;
  string path = 3;
}

message ProcessStoryImageResponse {
  bool success = 1;
  repeated StoryImageVariant variants = 2;
  string error = 3;
}

message EnqueueVideoTranscodeRequest {
  string fileId = 1;
  string userId = 2;
}

message EnqueueVideoTranscodeResponse {
  bool queued = 1;
}
