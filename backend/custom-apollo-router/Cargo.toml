[package]
name = "custom-apollo-router"
version = "0.1.0"
edition = "2021"

[dependencies]
apollo-router = "2.17.0"
jsonwebtoken = "9.3"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
tower = "0.4"
tracing = "0.1"
async-trait = "0.1"
