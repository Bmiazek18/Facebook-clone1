server.port=8095

# Application
spring.application.name=analytics-service

# Database Configuration (ClickHouse)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:clickhouse://localhost:8123/analytics_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:default}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:default_password}
spring.datasource.driver-class-name=com.clickhouse.jdbc.ClickHouseDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Schema Initialization
spring.sql.init.mode=always
spring.sql.init.platform=clickhouse

# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=analytics-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.streams.application-id=analytics-streams-app
