  HTTP Mapping: 429 Too Many Requests
  Error Type: UNAVAILABLE
  """
  TOO_MANY_REQUESTS @join__enumValue(graph: CHAT) @join__enumValue(graph: FEED) @join__enumValue(graph: SOCIALGRAPH) @join__enumValue(graph: USERS)

