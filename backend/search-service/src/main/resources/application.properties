spring.application.name=SearchService

# Server Configuration
server.port=8088
grpc.server.port=9097

# Meilisearch Configuration
meilisearch.host=${MEILI_HOST:http://localhost:7700}
meilisearch.api-key=${MEILI_API_KEY:masterKey}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# gRPC Client to communicate with user-service
grpc.client.user-service.address=${USER_SERVICE_GRPC_ADDRESS:dns:///localhost:9090}
grpc.client.user-service.negotiation-type=plaintext

# Resilience4j Configuration
resilience4j.circuitbreaker.instances.userService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.userService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userService.waitDurationInOpenState=10000ms
resilience4j.circuitbreaker.instances.userService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.userService.registerHealthIndicator=true

resilience4j.retry.instances.userService.maxAttempts=3
resilience4j.retry.instances.userService.waitDuration=200ms

# Graceful Shutdown
spring.lifecycle.timeout-per-shutdown-phase=30s
server.shutdown=graceful

# gRPC Server Keepalive
grpc.server.enable-keep-alive=true
grpc.server.keep-alive-time=30s
grpc.server.keep-alive-timeout=5s
grpc.server.permit-keep-alive-without-calls=true
grpc.server.max-connection-age=5m
grpc.server.max-connection-age-grace=30s

# gRPC Client Keepalive (Default for all clients)
grpc.client.default.keep-alive-time=30s
grpc.client.default.keep-alive-timeout=5s
grpc.client.default.keep-alive-without-calls=true

# Actuator Endpoint Exposure
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always
