groups:
  - name: facebook-app-alerts
    rules:
      - alert: HighHttp5xxRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (job) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate on {{ $labels.job }}"
          description: "Service {{ $labels.job }} has an error rate of {{ $value }} 5xx errors/sec for > 2m."

      - alert: JvmHeapUsageHigh
        expr: (sum(jvm_memory_used_bytes{area="heap"}) by (job) / sum(jvm_memory_max_bytes{area="heap"}) by (job)) > 0.85
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "JVM Heap usage > 85% on {{ $labels.job }}"
          description: "JVM Heap usage on {{ $labels.job }} is currently at {{ $value | humanizePercentage }}."

      - alert: HikariCpPoolExhaustion
        expr: hikaricp_connections_pending > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HikariCP database pool saturated on {{ $labels.job }}"
          description: "Database connection pool {{ $labels.pool }} on {{ $labels.job }} has {{ $value }} pending acquire threads."

      - alert: HighHttpP95Latency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, job)) > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency on {{ $labels.job }}"
          description: "P95 latency on {{ $labels.job }} is {{ $value }}s (> 1.5s)."
