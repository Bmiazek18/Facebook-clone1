spring.application.name=UserService

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql-user.apps.svc.cluster.local:5432/users_db}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8081

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# MinIO Configuration
minio.url=http://localhost:9000
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=avatars
minio.presigned-expiry-seconds=604800

# Stable proxy URLs for media (Kong/BFF)
media.stable-url-base=${MEDIA_STABLE_URL_BASE:http://localhost:8080}

# gRPC Server Configuration
grpc.server.port=9090

# Configure gRPC client to communicate with socialgraph-service
grpc.client.social-graph-service.address=${SOCIAL_GRAPH_SERVICE_GRPC_ADDRESS:dns:///localhost:9091}
grpc.client.social-graph-service.negotiation-type=plaintext

# Configure gRPC client to communicate with feed-service
grpc.client.feed-service.address=${FEED_SERVICE_GRPC_ADDRESS:dns:///localhost:9092}
grpc.client.feed-service.negotiation-type=plaintext

# Downstream gRPC services
grpc.client.chat-service.address=${CHAT_SERVICE_GRPC_ADDRESS:dns:///localhost:9095}
grpc.client.chat-service.negotiation-type=plaintext
grpc.client.notification-service.address=${NOTIFICATION_SERVICE_GRPC_ADDRESS:dns:///localhost:9093}
grpc.client.notification-service.negotiation-type=plaintext
grpc.client.marketplace-service.address=${MARKETPLACE_SERVICE_GRPC_ADDRESS:dns:///localhost:9096}
grpc.client.marketplace-service.negotiation-type=plaintext
grpc.client.search-service.address=${SEARCH_SERVICE_GRPC_ADDRESS:dns:///localhost:9097}
grpc.client.search-service.negotiation-type=plaintext

mqtt.service-token=${MQTT_SERVICE_TOKEN:chat-service-internal}

# Observability: OpenTelemetry
otel.sdk.disabled=false
otel.traces.exporter=otlp
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
otel.exporter.otlp.headers=Authorization=Bearer ${OTEL_EXPORTER_OTLP_HEADERS_AUTHORIZATION:}
otel.service.name=user-service
otel.traces.sampler=parentbased_traceidratio
otel.traces.sampler.arg=0.1
otel.instrumentation.spring-web.enabled=true
otel.instrumentation.grpc.enabled=true
otel.instrumentation.jpa.enabled=true
otel.instrumentation.jdbc.enabled=true

# Sentry
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}
sentry.enable-tracing=true
sentry.attach-stacktrace=true
sentry.include-exception-cause=true
logging.level.io.sentry=debug

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Resilience4j Configuration (Default settings for all instances)
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10000ms
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.socialGraphService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.searchService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.chatService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.notificationService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.marketplaceService.registerHealthIndicator=true

resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=200ms

# Bulkhead Configuration
resilience4j.bulkhead.configs.default.maxConcurrentCalls=15
resilience4j.bulkhead.configs.default.maxWaitDuration=50ms

# Graceful Shutdown
spring.lifecycle.timeout-per-shutdown-phase=30s
server.shutdown=graceful

# gRPC Server Keepalive
grpc.server.enable-keep-alive=true
grpc.server.keep-alive-time=30s
grpc.server.keep-alive-timeout=5s
grpc.server.permit-keep-alive-without-calls=true
grpc.server.max-connection-age=5m
grpc.server.max-connection-age-grace=30s

# gRPC Client Keepalive (Default for all clients)
grpc.client.default.keep-alive-time=30s
grpc.client.default.keep-alive-timeout=5s
grpc.client.default.keep-alive-without-calls=true

# Actuator Endpoint Exposure
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always

# MQTT Configuration for Presence/Heartbeat
mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
mqtt.topic=user/presence/heartbeat
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}