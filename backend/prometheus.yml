global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889', 'otel-collector:8888']

  - job_name: 'spring-services'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets:
          - 'user-service:8081'
          - 'chat-service:8083'
          - 'feed-service:8085'
          - 'analytics-service:8095'
