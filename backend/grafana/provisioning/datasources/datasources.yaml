apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: jaeger
          matcherRegex: "trace_id[:=]\\s*\"?(\\w+)\"?"
          name: TraceID
          url: "$${__value.raw}"
  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      nodeGraph:
        enabled: true
  - name: Sentry
    type: grafana-sentry-datasource
    uid: sentry
    access: proxy
    url: http://sentry:8000
    jsonData:
      orgSlug: glitchtip
