server.port=8099
spring.application.name=marketplace-edge-service

# Configure gRPC client to communicate with marketplace-service
grpc.client.marketplace-service.address=${MARKETPLACE_SERVICE_GRPC_ADDRESS:dns:///localhost:9096}
grpc.client.marketplace-service.negotiation-type=plaintext

# Graceful Shutdown
spring.lifecycle.timeout-per-shutdown-phase=30s
server.shutdown=graceful

# Actuator Endpoint Exposure
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always

# Resilience4j Circuit Breaker configuration
resilience4j.circuitbreaker.instances.marketplaceService.sliding-window-size=10
resilience4j.circuitbreaker.instances.marketplaceService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.marketplaceService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.marketplaceService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.marketplaceService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.marketplaceService.automatic-transition-from-open-to-half-open-enabled=true

# Resilience4j Retry configuration
resilience4j.retry.instances.marketplaceService.max-attempts=3
resilience4j.retry.instances.marketplaceService.wait-duration=100ms
resilience4j.retry.instances.marketplaceService.enable-exponential-backoff=true
resilience4j.retry.instances.marketplaceService.exponential-backoff-multiplier=2

# Resilience4j Bulkhead configuration
resilience4j.bulkhead.instances.marketplaceService.max-concurrent-calls=25
resilience4j.bulkhead.instances.marketplaceService.max-wait-duration=20ms
