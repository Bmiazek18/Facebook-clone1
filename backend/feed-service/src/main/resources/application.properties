spring.application.name=feed-service
server.port=8086

# Configure gRPC server to run on port 9092
grpc.server.port=9092

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/users_db}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Upload Directory Configuration
app.upload.dir=${UPLOAD_DIR:uploads}

# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Configure gRPC client to communicate with socialgraph-service
grpc.client.social-graph-service.address=${SOCIAL_GRAPH_SERVICE_GRPC_ADDRESS:dns:///localhost:9091}
grpc.client.social-graph-service.negotiation-type=plaintext

# Configure gRPC client to communicate with user-service
grpc.client.user-service.address=${USER_SERVICE_GRPC_ADDRESS:dns:///userservice:9090}
grpc.client.user-service.negotiation-type=plaintext

grpc.client.notification-service.address=${NOTIFICATION_SERVICE_GRPC_ADDRESS:dns:///localhost:9093}
grpc.client.notification-service.negotiation-type=plaintext

# Configure gRPC client to communicate with video-abr-service
grpc.client.abr-service.address=${ABR_SERVICE_GRPC_ADDRESS:dns:///video-abr-service:9095}
grpc.client.abr-service.negotiation-type=plaintext

grpc.client.groups-service.address=${GROUPS_SERVICE_GRPC_ADDRESS:dns:///localhost:9098}
grpc.client.groups-service.negotiation-type=plaintext

# Resilience4j Configuration (Default configs)
resilience4j.circuitbreaker.configs.default.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=10000ms
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true

resilience4j.retry.configs.default.maxAttempts=3
resilience4j.retry.configs.default.waitDuration=200ms

# Bulkhead Configuration
resilience4j.bulkhead.configs.default.maxConcurrentCalls=15
resilience4j.bulkhead.configs.default.maxWaitDuration=50ms

# Graceful Shutdown
spring.lifecycle.timeout-per-shutdown-phase=30s
server.shutdown=graceful

# gRPC Server Keepalive & Connection Age
grpc.server.enable-keep-alive=true
grpc.server.keep-alive-time=30s
grpc.server.keep-alive-timeout=5s
grpc.server.permit-keep-alive-without-calls=true
grpc.server.max-connection-age=5m
grpc.server.max-connection-age-grace=30s

# gRPC Client Keepalive (Default for all clients)
grpc.client.default.keep-alive-time=30s
grpc.client.default.keep-alive-timeout=5s
grpc.client.default.keep-alive-without-calls=true

# Actuator Endpoint Exposure
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always
